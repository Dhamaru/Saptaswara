version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router)
  - Tone.js (Audio Engine)
  - Supabase (Auth and Database)
  - Vanilla CSS
routes:
  - path: /
    file: apps/web/app/page.tsx
    auth_required: false
    description: Landing page
  - path: /studio
    file: apps/web/app/studio/page.tsx
    auth_required: false
    description: Core music studio with sequencer and AI assistant
  - path: /dashboard
    file: apps/web/app/dashboard/page.tsx
    auth_required: true
    description: User projects dashboard
  - path: /library
    file: apps/web/app/library/page.tsx
    auth_required: false
    description: Raga database explorer
  - path: /login
    file: apps/web/app/login/page.tsx
    auth_required: false
    description: Authentication page
features:
  - name: Raga Guided Studio
    description: Interact with traditional ragas using polyphonic instruments and a step sequencer.
    files:
      - apps/web/app/studio/page.tsx
      - apps/web/components/Piano.tsx
      - apps/web/components/DrumPad.tsx
      - apps/web/lib/audio.ts
    entry_route: /studio
    user_interactions:
      - Click on a raga card to load its notes
      - Play the virtual piano or drum pads
      - Toggle steps on the sequencer grid
      - Change instruments (Piano, Veena, Sitar, etc.)
    api_calls:
      - method: GET
        endpoint: /api/projects
  - name: AI Assistant
    description: Chat with an AI trained in Indian Classical Music for guidance.
    files:
      - apps/web/components/Assistant.tsx
      - apps/web/app/api/ai/chat/route.ts
    entry_route: /studio
    user_interactions:
      - Type a musical question in the chat assistant
      - Receive streaming swara-aware responses
    api_calls:
      - method: POST
        endpoint: /api/ai/chat
known_limitations:
  - issue: Audio context initialization requires first user click
    location: apps/web/lib/audio.ts
    impact: No sound until first interaction
